<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>Shapermint — Website UI Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App(){
      const [route, setRoute] = useState(() => localStorage.getItem('shm.route') || 'home');
      const [product, setProduct] = useState(null);
      const [cart, setCart] = useState([]);
      const [cartOpen, setCartOpen] = useState(false);

      useEffect(() => { localStorage.setItem('shm.route', route); }, [route]);

      function pickProduct(p){ setProduct(p); setRoute('pdp'); window.scrollTo(0,0); }
      function addToCart(it){
        setCart(c => {
          const key = `${it.id}-${it.color}-${it.size}`;
          const existing = c.find(x => x.key === key);
          if (existing) return c.map(x => x.key===key ? {...x, qty: x.qty + it.qty} : x);
          return [...c, {...it, key}];
        });
        setCartOpen(true);
      }
      function updateQty(key, qty){ setCart(c => c.map(x => x.key===key ? {...x, qty} : x)); }
      function removeItem(key){ setCart(c => c.filter(x => x.key!==key)); }

      return (<div data-screen-label={`SHM / ${route}`}>
        <PromoBar/>
        <UtilityBar/>
        <Nav onNav={(r)=>{setRoute(r); window.scrollTo(0,0);}} cartCount={cart.reduce((a,b)=>a+b.qty,0)} onBagClick={()=>setCartOpen(true)}/>
        {route==='home' && <Home onNav={(r)=>{setRoute(r); window.scrollTo(0,0);}} onPickProduct={pickProduct}/>}
        {route==='plp' && <PLP onNav={setRoute} onPickProduct={pickProduct}/>}
        {route==='pdp' && product && <PDP p={product} onNav={setRoute} onAdd={(it)=>addToCart({...it, id: it.id, key: `${it.id}-${it.color}-${it.size}`})}/>}
        {route==='checkout' && <Checkout items={cart.map(x=>({...x, id:x.key}))} onNav={setRoute}/>}
        <Footer/>
        <SideCart
          open={cartOpen}
          items={cart.map(x=>({...x, id:x.key}))}
          onClose={()=>setCartOpen(false)}
          onQty={(id,q)=>updateQty(id,q)}
          onRemove={(id)=>removeItem(id)}
          onCheckout={()=>{ setCartOpen(false); setRoute('checkout'); window.scrollTo(0,0); }}
        />
      </div>);
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
