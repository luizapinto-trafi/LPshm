<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; background:#fff; }
  .card { padding: 24px 28px; }
  .row { display:flex; align-items:center; gap: 14px; flex-wrap: wrap;}
  .swatch { display:flex; flex-direction:column; gap:6px; min-width: 92px;}
  .chip { height: 64px; border-radius: var(--radius-lg); border: 1px solid rgba(0,0,0,.06);}
  .name { font-size: 13px; color: var(--fg-1); font-weight: 600; font-family: var(--font-body);}
  .hex { font-size: 11px; color: var(--fg-3); font-family: ui-monospace, monospace;}
</style></head><body>
  <div class="card">
    <div class="row">
      <div class="swatch"><div class="chip" style="background:var(--ink-1000)"></div><div class="name">Ink 1000</div><div class="hex">#000000</div></div>
      <div class="swatch"><div class="chip" style="background:var(--ink-900)"></div><div class="name">Ink 900</div><div class="hex">#292929 · fg-1</div></div>
      <div class="swatch"><div class="chip" style="background:var(--ink-700)"></div><div class="name">Ink 700</div><div class="hex">#3A3A3A</div></div>
      <div class="swatch"><div class="chip" style="background:var(--ink-600)"></div><div class="name">Ink 600</div><div class="hex">#5A5A5A</div></div>
      <div class="swatch"><div class="chip" style="background:var(--ink-500)"></div><div class="name">Ink 500</div><div class="hex">#808080</div></div>
      <div class="swatch"><div class="chip" style="background:var(--ink-400)"></div><div class="name">Ink 400</div><div class="hex">#A6A6A6</div></div>
      <div class="swatch"><div class="chip" style="background:var(--ink-300)"></div><div class="name">Ink 300</div><div class="hex">#BBBBBB</div></div>
      <div class="swatch"><div class="chip" style="background:var(--ink-200)"></div><div class="name">Ink 200</div><div class="hex">#E5E5E5</div></div>
      <div class="swatch"><div class="chip" style="background:var(--ink-100)"></div><div class="name">Ink 100</div><div class="hex">#F5F5F5</div></div>
      <div class="swatch"><div class="chip" style="background:var(--white); border-color: var(--ink-200)"></div><div class="name">White</div><div class="hex">#FFFFFF</div></div>
    </div>
  </div>
</body></html>
