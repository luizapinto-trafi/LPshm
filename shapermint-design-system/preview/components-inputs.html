<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body);}
  .card{padding:24px 28px;display:flex;flex-direction:column;gap:10px;font-family:var(--font-body);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;}
  .meta{font-size:11px;color:var(--fg-3);font-family:ui-monospace,monospace;}
  .inp{height:48px;border-radius:var(--radius-lg);border:1px solid var(--ink-300);background:#fff;padding:0 16px;font-family:var(--font-body);font-size:16px;font-weight:400;color:var(--ink-900);min-width:220px;box-sizing:border-box;outline:none;}
  .inp::placeholder{color:var(--ink-500);font-family:var(--font-body);}
  .inp:focus{border-color:var(--ink-900);}
  .inp-err{border-color:var(--sale);}
  .inp-dis{background:var(--ink-100);color:var(--ink-400);}
  .label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-900);font-weight:600;font-family:var(--font-body);}
  .help{font-size:12px;color:var(--fg-3);font-family:var(--font-body);}
  .err{font-size:12px;color:var(--sale);font-family:var(--font-body);font-weight:400;}
</style></head><body>
  <div class="card">
    <div class="row">
      <label class="label">Email<input class="inp" placeholder="you@domain.com"></label>
      <label class="label">ZIP<input class="inp" value="11201"></label>
      <label class="label">Card <span style="color:var(--sale)">*</span><input class="inp inp-err" value="4242 4242 4242"><span class="err">Card number is invalid.</span></label>
      <label class="label">Promo<input class="inp inp-dis" value="LOVE10" disabled></label>
    </div>
    <div class="meta">Avenir Next LT Pro · 48px · r=8 · border #BBBBBB · focus #292929 · error #C64844</div>
  </div>
</body></html>
