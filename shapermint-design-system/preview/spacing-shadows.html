<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink-100);}
  .card{padding:32px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;}
  .tile{width:140px;height:72px;background:#fff;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--ink-900);}
  .xs{box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .sm{box-shadow:0 2px 4px rgba(0,0,0,.10);}
  .md{box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .lg{box-shadow:0 12px 32px rgba(0,0,0,.12);}
  .lbl{font-family:ui-monospace,monospace;font-size:11px;color:var(--fg-3);margin-top:6px;}
  .item{display:flex;flex-direction:column;gap:4px;align-items:center;}
</style></head><body>
  <div class="card">
    <div class="item"><div class="tile xs">xs</div><div class="lbl">0 1 2 rgba .06</div></div>
    <div class="item"><div class="tile sm">sm ★ nav</div><div class="lbl">0 2 4 rgba .10</div></div>
    <div class="item"><div class="tile md">md</div><div class="lbl">0 4 12 rgba .08</div></div>
    <div class="item"><div class="tile lg">lg</div><div class="lbl">0 12 32 rgba .12</div></div>
  </div>
</body></html>
