<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;}
  .card{padding:24px 28px;}
  .row{display:flex; align-items:center; gap: 10px; flex-wrap:wrap;}
  .stack{display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
  .meta{font-size:11px;color:var(--fg-3);font-family:ui-monospace,monospace;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:var(--font-body);font-weight:600;letter-spacing:.01em;}
  .btn-primary{background:var(--coral-300);color:var(--ink-700);height:48px;padding:0 32px;border-radius:var(--radius-lg);font-size:16px;}
  .btn-primary:hover{background:var(--coral-200);}
  .btn-primary-sm{background:var(--coral-300);color:var(--ink-700);height:40px;padding:0 24px;border-radius:var(--radius-lg);font-size:16px;}
  .btn-primary-xs{background:var(--coral-300);color:var(--ink-700);height:36px;padding:0 20px;border-radius:var(--radius-lg);font-size:14px;}
  .btn-primary:disabled, .btn-dis{background:var(--ink-150);color:var(--fg-muted);cursor:not-allowed;}
</style></head><body>
  <div class="card stack">
    <div class="row">
      <button class="btn btn-primary">Add to Cart</button>
      <button class="btn btn-primary-sm">Add to Cart</button>
      <button class="btn btn-primary-xs">Add to Cart</button>
      <button class="btn btn-primary btn-dis">Sold out</button>
    </div>
    <div class="meta">Primary · peach fill (#F7A08B) · r=8 · sizes 48/40/36 · hover → #F5BAB0</div>
  </div>
</body></html>
