<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;}
  .card{padding:20px 28px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;}
  .item{display:flex;flex-direction:column;gap:6px;align-items:center;}
  .ico{width:40px;height:40px;border:1px solid var(--ink-200);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;color:var(--ink-900);}
  .ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
  .lbl{font-family:ui-monospace,monospace;font-size:10px;color:var(--fg-3);}
</style></head><body>
  <div class="card">
    <div class="item"><div class="ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div><div class="lbl">search</div></div>
    <div class="item"><div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></div><div class="lbl">user</div></div>
    <div class="item"><div class="ico"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1.5 11a2 2 0 0 1-2 1.8h-5a2 2 0 0 1-2-1.8L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg></div><div class="lbl">bag</div></div>
    <div class="item"><div class="ico"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3.2-6.4"/><path d="M16 4v4h4"/></svg></div><div class="lbl">stopwatch</div></div>
    <div class="item"><div class="ico"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l3 6.8 7.4.6-5.7 4.9 1.8 7.2L12 17.8 5.5 21.5l1.8-7.2L1.6 9.4 9 8.8z"/></svg></div><div class="lbl">star-solid</div></div>
    <div class="item"><div class="ico"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div><div class="lbl">chevron-down</div></div>
    <div class="item"><div class="ico"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div><div class="lbl">chevron-right</div></div>
    <div class="item"><div class="ico"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></div><div class="lbl">menu</div></div>
    <div class="item"><div class="ico"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div><div class="lbl">close</div></div>
    <div class="item"><div class="ico"><svg viewBox="0 0 24 24"><path d="M4 7h16M6 7v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></div><div class="lbl">trash</div></div>
    <div class="item"><div class="ico"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h12"/></svg></div><div class="lbl">filters</div></div>
    <div class="item"><div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 6V4a4 4 0 0 1 8 0v2"/></svg></div><div class="lbl">lock (secure checkout)</div></div>
  </div>
</body></html>
